<div id="status"></div>
<main id="hub"></main>
<section id="einrichten" hidden>
  <div class="ein-karte">
    <span class="ein-av"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span>
    <h1>Training</h1>
    <form id="ein-form" autocomplete="off">
      <label>GitHub-Schlüssel<input name="token" type="password" placeholder="github_pat_…" required></label>
      <label>Repo<input name="repo" type="text" autocapitalize="off" spellcheck="false"></label>
      <p id="ein-meldung"></p>
      <button type="submit">Verbinden</button>
    </form>
    <small>Der Schlüssel bleibt nur auf diesem Gerät.</small>
  </div>
</section>
