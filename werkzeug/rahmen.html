<!doctype html><html><body style="margin:0;background:#333">
<iframe id="f" style="border:0;width:390px;height:844px;display:block;margin:0 auto"></iframe>
<script>
// ?app=kitchen öffnet die Küche (ohne Angabe das Training), alle übrigen Angaben gehen an die App weiter.
const q = new URLSearchParams(location.search), app = q.get('app'); q.delete('app');
document.getElementById('f').src = `/${app || 'training'}/` + (q.toString() ? '?' + q : '');
</script>
</body></html>
